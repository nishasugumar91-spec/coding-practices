<html>
<head>
<title>starting</title>


<style>
.subscribe-button{
background-color:red;
color:white;
border:none;

border-radius:25px;
font-size:19px;
font-weight:italic;
transition: background-color 0.5s,color 0.5s;
margin-left:10px;
cursor:pointer;
padding-right:30px;
padding-left:30px;
padding-top:10px;
padding-bottom:10px;
 
}
.join-button{
background-color:blue;
color:white;
border:none;
height:40px;
width:70px;
border-radius:8px;
font-size:19px;
font-weight:bold,italic;
margin-left:10px;
cursor:pointer;
}
.my-button{
background-color:white;
color:green;

height:40px;
width:100px;
border:4px solid green;

font-size:19px;
font-weight:bold;
margin-left:10px;
cursor:pointer;
}
.subscribe-button:hover{
background-color:rgb(80,0,0);
color:black;
opacity: 0.5;

box-shadow:10px 10px 5px rgba(0,0,0,0.4);
}
.my-button:active{
background-color:rgb(180,0,0);
color:black;
opacity: 0.5;

box-shadow:10px 10px 5px rgba(0,0,0,0.4);
}
.join-button:active{

}

</style>
</head>
<body><h4> hello! beauty </h4>
<button class="subscribe-button">Subscribe</button>
<button class="join-button">Join</button>
<button class="my-button">Tweet</button>
</body>
</html>
